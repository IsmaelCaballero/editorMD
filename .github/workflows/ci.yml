# CI de editorMD (F0.6): compila y prueba en los 4 sistemas objetivo (PLAN.md §5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Estilo y calidad (F0.7): no depende del SO, basta con ejecutarlo una vez.
  lint:
    name: Lint (ESLint, Prettier, rustfmt, clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema (WebKitGTK, necesarias para que clippy compile Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Lint TS/Svelte (ESLint + Prettier)
        run: npm run lint
      # generate_context!() necesita que exista dist/.
      - run: npm run build
      - name: Lint Rust (rustfmt + clippy -D warnings)
        run: npm run lint:rust

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Tipos (svelte-check + tsc)
        run: npm run check
      - name: Tests TS + cobertura
        run: npm run coverage
      # Tauri necesita dist/ para compilar (generate_context!).
      - name: Build frontend
        run: npm run build
      - name: Tests Rust (unitarios + doctests)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Documentación (TypeDoc + rustdoc)
        run: npm run docs

  fedora:
    name: Tests (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Dependencias del sistema
        run: |
          dnf install -y git gcc gcc-c++ make nodejs npm webkit2gtk4.1-devel openssl-devel \
            libappindicator-gtk3-devel librsvg2-devel libxdo-devel file curl
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
