[package]
name = "editormd"
version = "0.0.2"
description = "Editor Markdown WYSIWYG ligero y multiplataforma"
authors = ["Ismael Caballero"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"


[lib]
name = "editormd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
deunicode = "1.6.2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

# Lints del compilador y de clippy (F0.7). En la CI clippy se ejecuta con -D warnings.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Ruido habitual de pedantic que no aporta en este proyecto:
module_name_repetitions = "allow"
must_use_candidate = "allow"
